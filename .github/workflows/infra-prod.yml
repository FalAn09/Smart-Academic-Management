name: Infrastructure - PROD GitOps

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infrastructure/terraform/PROD/**' # Escucha solo cambios en la carpeta PROD

jobs:
  terraform:
    name: Terraform Plan & Apply (PROD)
    runs-on: ubuntu-latest
    
    # 2. Llamamos a los secretos con prefijo PROD_
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PROD_AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout of the code
        uses: actions/checkout@v4

      - name: Configure Terraform in the Runner
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        id: init
        run: |
          cd infrastructure/terraform/PROD
          terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd infrastructure/terraform/PROD
          terraform plan -no-color
        continue-on-error: false

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform/PROD
          terraform apply -auto-approve