name: CD - Build and Push to Docker Hub

on:
  push:
    branches: [ "qa" ] # Triggered when merging to the QA branch

jobs:
  build-and-push:
    name: Build Images and Push
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true # <-- ESTA ES LA MAGIA QUE APAGA EL BLOQUEO
    steps:
      - name: Checkout of the code
        uses: actions/checkout@v4

      - name: Configure Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      
      - run: pnpm install

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 1. Image compilation and upload (Servicios Originales)
      - name: Build and upload Auth Service
        run: |
          npx nx run auth-service:build:production
          docker build -f packages/auth-service/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

      - name: Build and upload Enrollment Service
        run: |
          npx nx run enrollment-service:build:production
          docker build -f packages/enrollment-service/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/enrollment-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/enrollment-service:latest

      - name: Build and upload Subject Service
        run: |
          npx nx run subject-service:build:production
          docker build -f packages/subject-service/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/subject-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/subject-service:latest

    # 2. NUEVO: Image compilation and upload (Nuevos Servicios)
      - name: Build and upload Program Service
        run: |
          npx nx run program-service:build:production
          docker build -f packages/program-service/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/program-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/program-service:latest

      - name: Build and upload API Gateway
        run: |
          npx nx run api-gateway:build:production
          docker build -f packages/api-gateway/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest